services:
    web:
      image: nginx:alpine
      container_name: servidor_web
      ports:
        - "8080:80"
      volumes:
        - ./web:/usr/share/nginx/html:ro 
      restart: unless-stopped
    web2:
      image: nginx:alpine
      container_name: servidor_web2
      ports:
        - "8082:80"
      volumes:
        - ./web2:/usr/share/nginx/html:ro
      restart: unless-stopped