services:
  base_dades:
    image: mariadb:10.11
    container_name: servidor_bd
    environment:
      MYSQL_ROOT_PASSWORD: contrasenya_root
      MYSQL_DATABASE: gestio_asix
      MYSQL_USER: alumne
      MYSQL_PASSWORD: 1234
    volumes:
     - dades_mysql:/var/lib/mysql
    networks:
     - xarxa_privada
  gestor_web:
    image: phpmyadmin:latest
    container_name: entorn_phpmyadmin
    ports:
     - "8080:80"
    environment:
      PMA_HOST: servidor_bd
    depends_on:
     - base_dades
    networks:
     - xarxa_privada
volumes:
  dades_mysql:
networks:
  xarxa_privada:
    driver: bridge